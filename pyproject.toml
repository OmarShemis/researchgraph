[project]
name = "researchgraph"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "deepagents>=0.7.41",
    "langchain-openai>=1.8.5",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.24",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "pydantic>=2.14.4",
    "langchain>=1.5.2",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "researchgraph"
