[project]
name = "researchgraph"
version = "0.1.0"
description = "A bounded multi-agent research workflow with LangGraph, Ollama, Tavily and MCP notes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain[mcp]>=1.4.2,<1.5",
    "langgraph>=1.2.14,<1.3",
    "langchain-openai>=1.6.2,<2",
    "langchain-tavily>=0.2.18,<0.3",
    "fastmcp>=4.0.5,<5",
    "python-dotenv>=1.2,<2",
]

[project.scripts]
researchgraph = "researchgraph.cli:main"
researchgraph-notes = "researchgraph.notes_mcp:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
